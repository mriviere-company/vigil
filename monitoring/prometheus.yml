# Prometheus config for the vigil local stack (Phase 4). Scrapes only the
# gateway: it's the sole service that exports Prometheus metrics
# (gateway/internal/metrics) — the Python inference services expose /health
# but no /metrics endpoint, so there's nothing else to scrape yet.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
