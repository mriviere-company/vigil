[project]
name = "vigil-common"
version = "0.1.0"
description = "Shared JSON logging, request-id middleware, service plumbing, and settings scaffolding for vigil inference services (internal, not published)"
requires-python = ">=3.12"
dependencies = [
  # RequestIDMiddleware is a Starlette (not FastAPI) middleware — declared
  # directly since it's imported directly, not just relied on transitively
  # via fastapi.
  "starlette>=0.38",
  # service.py's lifespan factory / health router are FastAPI constructs and
  # HealthResponse is a plain pydantic model — both imported directly.
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# Test/lint tooling — installed by default with `uv sync`.
dev = [
  "pytest>=8.3",
  # starlette's TestClient now requires httpx2 (httpx's successor package),
  # not httpx, to avoid a StarletteDeprecationWarning on every test.
  "httpx2>=2.0",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
