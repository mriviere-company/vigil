name: CI

# Push to main (or a v* tag) + every PR. Third-party actions are pinned by
# full commit SHA (comment carries the human version) per CLAUDE.md/PLAN.md
# §6 security standards. The default GITHUB_TOKEN is read-only everywhere in
# this file except the `publish` job, which grants itself `packages: write`
# at job scope (see its own permissions block) to push images to GHCR — the
# workflow-level block below stays contents:read-only.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR (new push obsoletes the old one).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Go: gateway/ -----------------------------------------------------
  # Mirrors Makefile's `lint` (fmt + vet + staticcheck) and `test` targets
  # (see Makefile at repo root), plus the coverage gate from the Phase 6
  # brief. staticcheck is installed explicitly (pinned) so Makefile's soft
  # "not on PATH" fallback in `lint` never silently no-ops in CI.
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod

      - name: Install staticcheck (pinned)
        # Version matches honnef.co/go/tools v0.7.0 (staticcheck 2026.1),
        # the release already vetted locally in Phase 3.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gofmt check
        # Makefile `fmt` target, verbatim.
        run: |
          unformatted=$(cd gateway && gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        # Makefile `lint` target, verbatim.
        run: cd gateway && go vet ./...

      - name: staticcheck
        run: cd gateway && staticcheck ./...

      - name: go test -race (with coverage)
        # Makefile `test` target (`go test -race ./...`) with -coverprofile
        # added, per the Phase 6 brief, to feed the coverage gate below.
        run: cd gateway && go test -race -coverprofile=cover.out ./...

      - name: Coverage gate (internal/ >= 80%)
        # go tool cover -func's own "total:" line is diluted by
        # cmd/gateway (main package, untested, 0% of a handful of
        # statements) — it is not the number this gate is about. This
        # step parses the raw coverprofile (same file `go tool cover`
        # reads) restricted to paths under /internal/ and computes a
        # true statement-weighted percentage, matching the 89.4% figure
        # already measured and recorded for gateway/internal/ in the
        # Phase 3 report.
        run: |
          cd gateway
          go tool cover -func=cover.out | tail -1
          awk '
            $1 ~ /\/internal\// { total += $2; if ($3 > 0) covered += $2 }
            END {
              if (total == 0) { print "no internal/ statements found in coverage profile"; exit 1 }
              pct = covered / total * 100
              printf "internal/ coverage: %.1f%% (%d/%d statements)\n", pct, covered, total
              if (pct < 80.0) {
                printf "FAIL: internal/ coverage %.1f%% is below the 80%% gate\n", pct
                exit 1
              }
            }
          ' cover.out

  # --- Python: the 3 uv-managed inference/ projects ----------------------
  # Commands mirror each pyproject.toml's own tool config (ruff/mypy
  # sections) — there is no root Makefile target for Python yet, so this
  # is the first place these exact commands run as a gate (Phases 1/2
  # ran them ad hoc; see the per-job mirroring table in the phase report).
  python:
    name: python (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: inference/text
            mypy_target: app
          - dir: inference/image
            mypy_target: app
          - dir: inference/common
            # common's importable package is vigil_common/, not app/ —
            # it ships no FastAPI app of its own (see inference/common/pyproject.toml).
            mypy_target: vigil_common
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - run: cd ${{ matrix.dir }} && uv sync --locked
      - run: cd ${{ matrix.dir }} && uv run ruff check .
      - run: cd ${{ matrix.dir }} && uv run ruff format --check .
      - run: cd ${{ matrix.dir }} && uv run mypy ${{ matrix.mypy_target }}
      - run: cd ${{ matrix.dir }} && uv run pytest

  # --- Terraform: fmt/validate/tflint over the 4 modules + dev env -------
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8" # matches the version validated locally in Phase 5
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive infra

      - name: terraform init + validate (4 modules + dev env)
        run: |
          set -e
          for dir in \
            infra/modules/network \
            infra/modules/ecs-service \
            infra/modules/alb \
            infra/modules/ecr \
            infra/environments/dev
          do
            echo "== $dir =="
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.63.1

      - name: tflint --init (aws ruleset)
        # --init downloads the aws ruleset plugin binary from GitHub
        # releases; GITHUB_TOKEN avoids the unauthenticated-API rate limit
        # (brief requirement).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init --config="${{ github.workspace }}/infra/.tflint.hcl"

      - name: tflint (4 modules + dev env)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for dir in \
            infra/modules/network \
            infra/modules/ecs-service \
            infra/modules/alb \
            infra/modules/ecr \
            infra/environments/dev
          do
            echo "== $dir =="
            tflint --chdir="$dir" --config="${{ github.workspace }}/infra/.tflint.hcl"
          done

      # IaC misconfiguration scan (PLAN.md Phase 6: "scan sécurité IaC").
      # Two passes so the severities behave differently: HIGH findings are
      # REPORTED but non-blocking (visible in the log, exit-code 0), while
      # CRITICAL findings FAIL the job (exit-code 1) — same blocking
      # threshold as the images job's Trivy scan.
      - name: Trivy IaC scan — report HIGH (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Scanner (not action) version pinned to the release validated
          # locally during Phase 6, so CI's finding counts match the
          # recorded local runs deterministically.
          version: v0.72.0
          scan-type: config
          scan-ref: infra
          format: table
          exit-code: "0"
          severity: HIGH

      - name: Trivy IaC scan — gate on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0 # same scanner pin as the HIGH pass above
          scan-type: config
          scan-ref: infra
          format: table
          exit-code: "1"
          severity: CRITICAL

  # --- Images: build the 3 service images, gate on size, scan with Trivy -
  images:
    name: images (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Context/dockerfile pairs mirror docker-compose.yml exactly
          # (see its header comment for why context must be the shared
          # inference/ root for text and image, and gateway/ itself for
          # the gateway service).
          - service: gateway
            context: gateway
            dockerfile: gateway/Dockerfile
            # 25 MB uncompressed: the static binary is 10.6 MB (well under
            # the plan's 20 MB *binary* target); the rest is
            # distroless/static's own uncompressed payload (tzdata,
            # ca-certs, ~10 MB). Measured 2026-07-12: image 21.6 MB
            # uncompressed. The original 20 was calibrated on a naive
            # binary+2MB estimate made before docker was available.
            max_size_mb: 25
          - service: text
            context: inference
            dockerfile: inference/text/Dockerfile
            max_size_mb: 800
          - service: image
            context: inference
            dockerfile: inference/image/Dockerfile
            max_size_mb: 800
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build (linux/amd64, load into the local daemon)
        # Same buildx invocation documented/proven in infra/README.md's
        # deploy procedure, minus --push (nothing to push to from CI).
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f ${{ matrix.dockerfile }} \
            -t vigil-${{ matrix.service }}:ci \
            --load \
            ${{ matrix.context }}

      - name: Image size gate (< ${{ matrix.max_size_mb }} MB)
        # Closes the Phase 1-3 acceptance item deferred for lack of a
        # Docker host (gateway < 20MB, inference images < 800MB per
        # CLAUDE.md "Containers" standard / each Dockerfile's own header
        # comment).
        run: |
          size_bytes=$(docker image inspect vigil-${{ matrix.service }}:ci --format='{{.Size}}')
          max_bytes=$((${{ matrix.max_size_mb }} * 1024 * 1024))
          size_mb=$((size_bytes / 1024 / 1024))
          echo "vigil-${{ matrix.service }}:ci is ${size_mb} MB (limit ${{ matrix.max_size_mb }} MB)"
          if [ "$size_bytes" -gt "$max_bytes" ]; then
            echo "FAIL: image exceeds the ${{ matrix.max_size_mb }} MB budget"
            exit 1
          fi

      - name: Trivy scan (fail on CRITICAL, ignore unfixed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0 # scanner pin — same trivy release validated locally in Phase 6
          image-ref: vigil-${{ matrix.service }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

  # --- gitleaks: full history --------------------------------------------
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history, not just the merge commit

      - name: Install gitleaks (pinned binary, checksum-verified)
        # The official gitleaks-action nags non-license-holding orgs on
        # every run (it gates a chunk of its output behind a
        # GITLEAKS_LICENSE for "organization" use) and adds another
        # third-party Docker action to trust for what is, underneath,
        # a single static binary. Downloading the pinned release
        # directly (version + published sha256, same pattern as the
        # k6/terraform/tflint user-local installs already used in this
        # repo) is simpler and avoids that entirely — gitleaks itself
        # (the binary, GPL-free CLI) has no license gate.
        run: |
          set -e
          cd /tmp
          curl -sL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks detect (full history)
        run: gitleaks detect --source . --redact -v

  # --- Publish: push the 3 service images to GHCR -----------------------
  # `needs` every other job, so this only starts once each has reported
  # success (GitHub Actions ANDs that implicit success() check with the
  # `if` below even though `if` is set explicitly) — "green" is enforced by
  # the job graph, not just the ref check. The ref check then restricts
  # *which* green runs actually publish: a push to `main`, or a push of a
  # `v*` tag. A `pull_request` run (or a push to any other branch) always
  # fails the ref check and this job is skipped, never published.
  publish:
    name: publish (${{ matrix.service }})
    needs: [go, python, terraform, images, gitleaks]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Job-scoped only: the workflow-level block above stays contents:read-only.
    # This is the one job in the file that needs to write anything, and only
    # to GHCR — never to repo contents.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Context/dockerfile pairs mirror the `images` job above exactly.
          - service: gateway
            context: gateway
            dockerfile: gateway/Dockerfile
            description: "vigil gateway: Go reverse proxy with API-key auth, per-tier rate limiting, a hand-written circuit breaker, and verdict aggregation."
          - service: text
            context: inference
            dockerfile: inference/text/Dockerfile
            description: "vigil text inference service: FastAPI + ONNX Runtime toxicity/spam scoring."
          - service: image
            context: inference
            dockerfile: inference/image/Dockerfile
            description: "vigil image inference service: FastAPI + ONNX Runtime NSFW scoring."
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        # Main push: rolling `latest` + an immutable `sha-<short>`. Tag push
        # (refs/tags/vX.Y.Z): just the semver tag itself — the two triggers
        # never both match the same run, so a run only ever produces one of
        # these tag sets.
        env:
          SERVICE: ${{ matrix.service }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/mriviere-company/vigil-${SERVICE}"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAGS="$IMAGE:$REF_NAME"
          else
            SHORT_SHA="${SHA:0:7}"
            TAGS="$IMAGE:latest
          $IMAGE:sha-$SHORT_SHA"
          fi
          {
            echo "tags<<TAGEOF"
            echo "$TAGS"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/mriviere-company/vigil
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
          # Same builder/registry cache backend for every push of this
          # service — reuses layers across runs instead of a cold rebuild
          # each time (this job's own build cost, not a claim of sharing
          # the `images` job's separate --load build above).
          cache-from: type=gha,scope=publish-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.service }}
